<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOC Triage Console</title>
<style>
  :root{
    --bg:#0b0e12; --panel:#12161c; --panel2:#171c23; --border:#232a33; --border-strong:#323b47;
    --text:#dfe6ee; --text-dim:#8b98a8; --text-mute:#5b6675;
    --crit:#ff5c5c; --crit-bg:#3a1414; --crit-dim:#ffb3b3;
    --high:#ff9f43; --high-bg:#3a2510; --high-dim:#ffd0a0;
    --med:#f2c94c; --med-bg:#332c0d; --med-dim:#f5df9d;
    --low:#5aa9e6; --low-bg:#0e2436; --low-dim:#a9d3f2;
    --info:#8a94a3; --info-bg:#1c2028; --info-dim:#c3c9d2;
    --ok:#3ecf8e; --ok-bg:#0d2b20;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:14px; line-height:1.5;
  }
  ::selection{background:#2a4a6b;}

  /* ---- top bar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; border-bottom:1px solid var(--border); background:var(--panel);
    position:sticky; top:0; z-index:10;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px var(--ok-bg);}
  .brand h1{font-size:15px; font-weight:600; margin:0; letter-spacing:.2px;}
  .brand .sub{font-size:12px; color:var(--text-mute); font-family:var(--mono);}
  .stats{display:flex; gap:10px;}
  .stat{
    display:flex; flex-direction:column; align-items:flex-end; padding:4px 12px;
    border-left:1px solid var(--border); min-width:64px;
  }
  .stat .n{font-family:var(--mono); font-size:16px; font-weight:600;}
  .stat .l{font-size:10.5px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.06em;}
  .stat.crit .n{color:var(--crit);} .stat.high .n{color:var(--high);}
  .stat.med .n{color:var(--med);} .stat.low .n{color:var(--low);}
  .stat.open .n{color:var(--text);}

  /* ---- layout ---- */
  .layout{display:grid; grid-template-columns:220px 1fr; min-height:calc(100vh - 57px);}
  .sidebar{
    border-right:1px solid var(--border); background:var(--panel); padding:18px 16px;
    position:sticky; top:57px; align-self:start; height:calc(100vh - 57px); overflow-y:auto;
  }
  .sidebar h3{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-mute); margin:0 0 8px;}
  .filter-group{margin-bottom:22px;}
  .chip-row{display:flex; flex-direction:column; gap:4px;}
  .chip{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:6px 8px; border-radius:6px; cursor:pointer; font-size:12.5px;
    border:1px solid transparent; color:var(--text-dim);
  }
  .chip:hover{background:var(--panel2);}
  .chip.active{background:var(--panel2); border-color:var(--border-strong); color:var(--text);}
  .chip .sw{width:8px; height:8px; border-radius:2px; flex-shrink:0;}
  .chip .ct{font-family:var(--mono); font-size:11px; color:var(--text-mute); margin-left:auto;}
  .sw.crit{background:var(--crit);} .sw.high{background:var(--high);}
  .sw.med{background:var(--med);} .sw.low{background:var(--low);} .sw.info{background:var(--info);}
  .sw.open{background:var(--ok);} .sw.closed{background:var(--text-mute);} .sw.forwarded{background:var(--low);}

  .search{
    width:100%; padding:8px 10px; background:var(--bg); border:1px solid var(--border);
    border-radius:6px; color:var(--text); font-size:12.5px; font-family:var(--sans);
  }
  .search:focus{outline:none; border-color:var(--border-strong);}
  .search::placeholder{color:var(--text-mute);}

  /* ---- main / queue ---- */
  .main{padding:20px 26px 60px;}
  .queue-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .queue-head h2{font-size:14px; font-weight:600; margin:0;}
  .queue-head .count{font-size:12px; color:var(--text-mute); font-family:var(--mono);}

  .ticket{
    border:1px solid var(--border); border-left:3px solid var(--info); background:var(--panel);
    border-radius:8px; margin-bottom:8px; overflow:hidden; transition:border-color .12s;
  }
  .ticket.sev-critical{border-left-color:var(--crit);}
  .ticket.sev-high{border-left-color:var(--high);}
  .ticket.sev-medium{border-left-color:var(--med);}
  .ticket.sev-low{border-left-color:var(--low);}
  .ticket.status-closed{opacity:.5;}
  .ticket.status-forwarded{opacity:.75;}

  .ticket-row{
    display:grid; grid-template-columns:88px 1fr 130px 90px 20px;
    align-items:center; gap:14px; padding:12px 16px; cursor:pointer;
  }
  .ticket-row:hover{background:var(--panel2);}
  .sev-badge{
    font-family:var(--mono); font-size:10.5px; font-weight:600; text-transform:uppercase;
    letter-spacing:.04em; padding:3px 7px; border-radius:4px; text-align:center; width:fit-content;
  }
  .sev-badge.critical{background:var(--crit-bg); color:var(--crit-dim);}
  .sev-badge.high{background:var(--high-bg); color:var(--high-dim);}
  .sev-badge.medium{background:var(--med-bg); color:var(--med-dim);}
  .sev-badge.low{background:var(--low-bg); color:var(--low-dim);}

  .ticket-title{min-width:0;}
  .ticket-title .t{font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ticket-title .m{font-size:11.5px; color:var(--text-mute); font-family:var(--mono); margin-top:2px;}

  .ticket-cat{font-size:11.5px; color:var(--text-dim);}
  .ticket-status{font-size:11px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.04em;}
  .ticket-status.open{color:var(--ok);}
  .ticket-status.closed{color:var(--text-mute);}
  .ticket-status.forwarded{color:var(--low);}
  .chevron{color:var(--text-mute); font-size:11px; transition:transform .15s; text-align:right;}
  .ticket.expanded .chevron{transform:rotate(90deg);}

  .ticket-body{display:none; padding:0 16px 16px 16px; border-top:1px solid var(--border);}
  .ticket.expanded .ticket-body{display:block;}

  .tb-section{margin-top:14px;}
  .tb-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-mute); margin-bottom:6px;}
  .tb-desc{font-size:13px; color:var(--text); line-height:1.6;}
  .tb-action{font-size:13px; color:var(--text-dim); line-height:1.6; padding:10px 12px; background:var(--panel2); border-radius:6px; border-left:2px solid var(--border-strong);}

  .tb-meta{display:flex; flex-wrap:wrap; gap:16px; margin-top:12px; font-family:var(--mono); font-size:11.5px; color:var(--text-dim);}
  .tb-meta span b{color:var(--text-mute); font-weight:400; margin-right:4px;}

  .evidence{
    background:#080a0d; border:1px solid var(--border); border-radius:6px; padding:10px 12px;
    font-family:var(--mono); font-size:11px; color:#9fb0c3; max-height:160px; overflow-y:auto;
    white-space:pre-wrap; word-break:break-all; line-height:1.6;
  }
  .evidence div{padding:1px 0; border-bottom:1px solid #14181e;}
  .evidence div:last-child{border-bottom:none;}

  .tb-actions{display:flex; gap:8px; margin-top:16px; align-items:center; flex-wrap:wrap;}
  button.act{
    font-family:var(--sans); font-size:12.5px; font-weight:500; padding:7px 14px; border-radius:6px;
    border:1px solid var(--border-strong); background:var(--panel2); color:var(--text); cursor:pointer;
  }
  button.act:hover{background:var(--border);}
  button.act.close-btn{border-color:#3ecf8e55; color:var(--ok);}
  button.act.close-btn:hover{background:var(--ok-bg);}
  button.act.forward-btn{border-color:#5aa9e655; color:var(--low);}
  button.act.forward-btn:hover{background:var(--low-bg);}
  button.act.reopen-btn{color:var(--text-dim);}
  select.fwd-select{
    font-family:var(--sans); font-size:12.5px; padding:6px 10px; border-radius:6px;
    border:1px solid var(--border-strong); background:var(--bg); color:var(--text);
  }
  .notes-row{margin-top:10px; display:none;}
  .notes-row.show{display:block;}
  textarea.notes{
    width:100%; min-height:56px; background:var(--bg); border:1px solid var(--border);
    border-radius:6px; color:var(--text); font-family:var(--sans); font-size:12.5px; padding:8px 10px; resize:vertical;
  }
  textarea.notes:focus{outline:none; border-color:var(--border-strong);}

  .resolved-tag{
    display:inline-block; margin-top:10px; font-size:11.5px; font-family:var(--mono);
    padding:4px 9px; border-radius:5px; color:var(--text-dim); background:var(--panel2);
  }

  .empty{text-align:center; padding:60px 20px; color:var(--text-mute);}
  .empty .big{font-size:28px; margin-bottom:10px;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="dot"></div>
    <div>
      <h1>SOC Triage Console</h1>
      <div class="sub">firewall.log · auth.log · ids.log — classified &amp; AI-enriched</div>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="filter-group">
      <h3>Search</h3>
      <input class="search" id="searchBox" placeholder="IP, user, keyword...">
    </div>

    <div class="filter-group">
      <h3>Severity</h3>
      <div class="chip-row" id="sevFilters"></div>
    </div>

    <div class="filter-group">
      <h3>Status</h3>
      <div class="chip-row" id="statusFilters"></div>
    </div>

    <div class="filter-group">
      <h3>Category</h3>
      <div class="chip-row" id="catFilters"></div>
    </div>
  </div>

  <div class="main">
    <div class="queue-head">
      <h2>Ticket queue</h2>
      <div class="count" id="queueCount"></div>
    </div>
    <div id="ticketList"></div>
  </div>
</div>

<script>
const TICKETS = [{"id":"TCK-8E5D25E2","timestamp":"07/28/2026-01:48:51.000","severity":"critical","category":"IDS Alert","title":"ET MALWARE Cobalt Strike Beacon C2 Checkin \u2014 10.0.0.11 \u2192 194.36.190.53 (10 check-ins)","description":"Internal host 10.0.0.11 is generating repeated Cobalt Strike Beacon C2 check-in connections to the external IP 194.36.190.53 over port 443, with 10 events recorded at consistent roughly 60-second intervals between 01:48 and 01:58 UTC on 28 July 2026. This highly regular beaconing pattern is characteristic of an active Cobalt Strike implant maintaining communication with an attacker-controlled command-and-control server. The ongoing, persistent nature of the check-ins strongly indicates the host is compromised and may be awaiting or already receiving operator commands.","recommended_action":"Isolate 10.0.0.11 from the network immediately to cut off the C2 channel, then initiate a full endpoint forensic investigation on that host to identify the Cobalt Strike payload, its persistence mechanism, and any lateral movement or post-exploitation activity that may have already occurred. Additionally, block outbound traffic to 194.36.190.53 at the perimeter firewall and search for any other internal hosts communicating with that IP.","src_ip":"10.0.0.11","dst_ip":"194.36.190.53","user":null,"event_count":10,"evidence":["07/28/2026-01:48:51.000 [**] [1:2024766:2] ET MALWARE Cobalt Strike Beacon C2 Checkin [**] [Classification: A Network Trojan was Detected] [Priority: 1] {TCP} 10.0.0.11:30864 -> 194.36.190.53:443","07/28/2026-01:49:53.000 [**] [1:2024766:2] ET MALWARE Cobalt Strike Beacon C2 Checkin [**] [Classification: A Network Trojan was Detected] [Priority: 1] {TCP} 10.0.0.11:52421 -> 194.36.190.53:443","07/28/2026-01:50:55.000 [**] [1:2024766:2] ET MALWARE Cobalt Strike Beacon C2 Checkin [**] [Classification: A Network Trojan was Detected] [Priority: 1] {TCP} 10.0.0.11:14581 -> 194.36.190.53:443","07/28/2026-01:51:57.000 [**] [1:2024766:2] ET MALWARE Cobalt Strike Beacon C2 Checkin [**] [Classification: A Network Trojan was Detected] [Priority: 1] {TCP} 10.0.0.11:35175 -> 194.36.190.53:443","07/28/2026-01:52:59.000 [**] [1:2024766:2] ET MALWARE Cobalt Strike Beacon C2 Checkin [**] [Classification: A Network Trojan was Detected] [Priority: 1] {TCP} 10.0.0.11:32673 -> 194.36.190.53:443","07/28/2026-01:54:01.000 [**] [1:2024766:2] ET MALWARE Cobalt Strike Beacon C2 Checkin [**] [Classification: A Network Trojan was Detected] [Priority: 1] {TCP} 10.0.0.11:23850 -> 194.36.190.53:443","07/28/2026-01:55:03.000 [**] [1:2024766:2] ET MALWARE Cobalt Strike Beacon C2 Checkin [**] [Classification: A Network Trojan was Detected] [Priority: 1] {TCP} 10.0.0.11:32229 -> 194.36.190.53:443","07/28/2026-01:56:05.000 [**] [1:2024766:2] ET MALWARE Cobalt Strike Beacon C2 Checkin [**] [Classification: A Network Trojan was Detected] [Priority: 1] {TCP} 10.0.0.11:7421 -> 194.36.190.53:443","07/28/2026-01:57:07.000 [**] [1:2024766:2] ET MALWARE Cobalt Strike Beacon C2 Checkin [**] [Classification: A Network Trojan was Detected] [Priority: 1] {TCP} 10.0.0.11:29739 -> 194.36.190.53:443","07/28/2026-01:58:09.000 [**] [1:2024766:2] ET MALWARE Cobalt Strike Beacon C2 Checkin [**] [Classification: A Network Trojan was Detected] [Priority: 1] {TCP} 10.0.0.11:48340 -> 194.36.190.53:443"],"status":"open","forwarded_to":null,"analyst_notes":""},{"id":"TCK-BFFB83A4","timestamp":"07/28/2026-02:00:01.000","severity":"critical","category":"IDS Alert","title":"ET EXPLOIT Possible Log4j RCE Attempt (Log4Shell) \u2014 91.219.237.244 \u2192 10.0.0.10","description":"At 02:00:01 on 07/28/2026, the IDS detected a single inbound TCP connection from external IP 91.219.237.244 (port 51422) to internal host 10.0.0.10 on port 443, matching the Suricata signature for a Log4Shell (CVE-2021-44228) remote code execution attempt. Log4Shell exploits allow unauthenticated attackers to trigger arbitrary code execution on systems using vulnerable Log4j versions by injecting malicious JNDI lookup strings into logged data. This signature fires on 'Attempted Administrator Privilege Gain' at Priority 1, indicating the payload pattern is consistent with an active exploitation attempt rather than a scan. The timing at 02:00 local time may suggest an automated or targeted off-hours attack.","recommended_action":"Immediately isolate 10.0.0.10 from the network if possible, then capture and inspect the full HTTP request payload to confirm the presence of a JNDI injection string and determine whether the server is running a vulnerable Log4j version; also check 10.0.0.10's outbound connections around the same timestamp for any LDAP, RMI, or DNS callbacks to external hosts that would indicate successful exploitation.","src_ip":"91.219.237.244","dst_ip":"10.0.0.10","user":null,"event_count":1,"evidence":["07/28/2026-02:00:01.000 [**] [1:2023924:3] ET EXPLOIT Possible Log4j RCE Attempt (Log4Shell) [**] [Classification: Attempted Administrator Privilege Gain] [Priority: 1] {TCP} 91.219.237.244:51422 -> 10.0.0.10:443"],"status":"open","forwarded_to":null,"analyst_notes":""},{"id":"TCK-9781046B","timestamp":"07/28/2026-02:03:01.000","severity":"critical","category":"IDS Alert","title":"GPL SQL_INJECTION SELECT FROM \u2014 185.220.101.47 \u2192 10.0.0.20","description":"External IP 185.220.101.47 sent 6 SQL injection attempts containing SELECT FROM statements directly to the MySQL port (3306) on internal host 10.0.0.20 over a roughly 44-second window beginning at 02:03:01 on 28 July 2026. The fact that the traffic is hitting port 3306 directly \u2014 rather than through a web application layer \u2014 suggests the database port may be externally exposed, which significantly increases the severity of this attack. The repeated, evenly-spaced attempts from the same source port indicate a persistent, likely automated exfiltration or enumeration effort.","recommended_action":"Immediately verify whether port 3306 on 10.0.0.20 is reachable from the internet and block 185.220.101.47 at the perimeter firewall; then inspect the MySQL logs on 10.0.0.20 for any successful queries, authentication attempts, or data returned to the attacker from that source IP during this timeframe.","src_ip":"185.220.101.47","dst_ip":"10.0.0.20","user":null,"event_count":6,"evidence":["07/28/2026-02:03:01.000 [**] [1:2100498:8] GPL SQL_INJECTION SELECT FROM [**] [Classification: Web Application Attack] [Priority: 1] {TCP} 185.220.101.47:44231 -> 10.0.0.20:3306","07/28/2026-02:03:05.551 [**] [1:2100498:8] GPL SQL_INJECTION SELECT FROM [**] [Classification: Web Application Attack] [Priority: 1] {TCP} 185.220.101.47:44231 -> 10.0.0.20:3306","07/28/2026-02:03:09.804 [**] [1:2100498:8] GPL SQL_INJECTION SELECT FROM [**] [Classification: Web Application Attack] [Priority: 1] {TCP} 185.220.101.47:44231 -> 10.0.0.20:3306","07/28/2026-02:03:26.444 [**] [1:2100498:8] GPL SQL_INJECTION SELECT FROM [**] [Classification: Web Application Attack] [Priority: 1] {TCP} 185.220.101.47:44231 -> 10.0.0.20:3306","07/28/2026-02:03:12.682 [**] [1:2100498:8] GPL SQL_INJECTION SELECT FROM [**] [Classification: Web Application Attack] [Priority: 1] {TCP} 185.220.101.47:44231 -> 10.0.0.20:3306","07/28/2026-02:03:44.967 [**] [1:2100498:8] GPL SQL_INJECTION SELECT FROM [**] [Classification: Web Application Attack] [Priority: 1] {TCP} 185.220.101.47:44231 -> 10.0.0.20:3306"],"status":"open","forwarded_to":null,"analyst_notes":""},{"id":"TCK-A493F842","timestamp":"07/28/2026-02:09:41.000","severity":"critical","category":"IDS Alert","title":"ET TROJAN Generic Trojan Data Exfiltration Attempt \u2014 10.0.0.20 \u2192 45.155.204.12","description":"At 02:09:41 on 28 July 2026, the IDS fired a Priority 1 signature (ET TROJAN Generic Trojan Data Exfiltration Attempt, SID 2027056) on a TCP connection from internal host 10.0.0.20 (ephemeral port 51900) to the external IP 45.155.204.12 over port 8443. Port 8443 is commonly used by malware to blend outbound C2 or data-theft traffic with legitimate HTTPS, making this pattern consistent with a trojan attempting to send stolen data to an attacker-controlled server. The off-hours timing (just after 2 AM) and the nature of the signature elevate concern that this represents active compromise rather than a false positive.","recommended_action":"Immediately isolate 10.0.0.20 from the network to prevent further exfiltration, then block 45.155.204.12 at the perimeter firewall and begin forensic triage of the host \u2014 reviewing running processes, scheduled tasks, and recent file activity \u2014 to identify the trojan and scope any data that may have been exfiltrated.","src_ip":"10.0.0.20","dst_ip":"45.155.204.12","user":null,"event_count":1,"evidence":["07/28/2026-02:09:41.000 [**] [1:2027056:1] ET TROJAN Generic Trojan Data Exfiltration Attempt [**] [Classification: A Network Trojan was Detected] [Priority: 1] {TCP} 10.0.0.20:51900 -> 45.155.204.12:8443"],"status":"open","forwarded_to":null,"analyst_notes":""},{"id":"TCK-5EC712B6","timestamp":"Jul 28 03:42:03","severity":"critical","category":"Brute Force / Credential Access","title":"SSH brute-force from 45.155.204.12 \u2014 followed by successful login","description":"Starting at 03:42:03, source IP 45.155.204.12 conducted a rapid SSH brute-force attack against dc01, generating at least 45 failed login attempts across the 'root' and 'admin' accounts within under a minute. Critically, the alert indicates this campaign was followed by a successful login, meaning the attacker likely gained interactive SSH access to dc01 \u2014 a domain controller \u2014 using one of these accounts. Unauthorized root or admin access to a domain controller represents a severe compromise with potential for full domain takeover.","recommended_action":"Immediately isolate dc01 from the network to prevent lateral movement or further attacker activity, and determine which account ('root' or 'admin') was successfully authenticated, then force a credential re ing a systematic probe of mail and file transfer services on this host within under a minute. This pattern of rapid, sequential port scanning against mail infrastructure is consistent with reconnaissance activity.","recommended_action":"Investigate whether 172.217.9.201 appears in any threat intelligence feeds or has prior activity in your logs, and confirm that 10.0.0.40 is not inadvertently exposing any of these services externally; if the source IP has no legitimate business justification, consider adding a block rule and escalating if additional activity from this IP is observed.","src_ip":"172.217.9.201","dst_ip":"10.0.0.40","user":null,"event_count":7,"evidence":["Jul 28 02:47:16 fw01 kernel: ACTION=DENY PROTO=TCP SRC=172.217.9.201 DST=10.0.0.40 SPT=53524 DPT=25","Jul 28 02:47:24 fw01 kernel: ACTION=DENY PROTO=TCP SRC=172.217.9.201 DST=10.0.0.40 SPT=11508 DPT=587","Jul 28 02:47:35 fw01 kernel: ACTION=DENY PROTO=TCP SRC=172.217.9.201 DST=10.0.0.40 SPT=10381 DPT=993","Jul 28 02:47:35 fw01 kernel: ACTION=DENY PROTO=TCP SRC=172.217.9.201 DST=10.0.0.40 SPT=16490 DPT=465","Jul 28 02:47:42 fw01 kernel: ACTION=DENY PROTO=TCP SRC=172.217.9.201 DST=10.0.0.40 SPT=45463 DPT=143","Jul 28 02:47:49 fw01 kernel: ACTION=DENY PROTO=TCP SRC=172.217.9.201 DST=10.0.0.40 SPT=3304 DPT=110","Jul 28 02:48:06 fw01 kernel: ACTION=DENY PROTO=TCP SRC=172.217.9.201 DST=10.0.0.40 SPT=25031 DPT=21"],"status":"open","forwarded_to":null,"analyst_notes":""},{"id":"TCK-1C804D85","timestamp":"Jul 28 01:07:45","severity":"low","category":"Authentication Anomaly","title":"Multiple failed logins from 10.0.7.67","description":"Six SSH authentication failures were recorded against dc01 originating from the internal host 10.0.7.67, targeting two user accounts: mchen (1 failure at 01:07:45) and tpatel (5 failures clustered between 03:47 and 03:49). The rapid succession of failures against tpatel across different source ports within roughly two minutes suggests a scripted or automated login attempt targeting that account. While the source is an internal IP, the pattern across multiple accounts warrants investigation.","recommended_action":"Identify the owner and current state of host 10.0.7.67 to determine whether it is a legitimate system or potentially compromised, and check whether any successful SSH logins to dc01 for mchen or tpatel occurred around these timestamps.","src_ip":"10.0.7.67","dst_ip":null,"user":"mchen, tpatel","event_count":6,"evidence":["Jul 28 01:07:45 dc01 sshd[7293]: Failed password for mchen from 10.0.7.67 port 57657 ssh2","Jul 28 03:46:58 dc01 sshd[9584]: Failed password for tpatel from 10.0.7.67 port 3240 ssh2","Jul 28 03:47:38 dc01 sshd[2217]: Failed password for tpatel from 10.0.7.67 port 62967 ssh2","Jul 28 03:48:17 dc01 sshd[1794]: Failed password for tpatel from 10.0.7.67 port 51115 ssh2","Jul 28 03:47:43 dc01 sshd[3252]: Failed password for tpatel from 10.0.7.67 port 56241 ssh2","Jul 28 03:49:13 dc01 sshd[2113]: Failed password for tpatel from 10.0.7.67 port 47369 ssh2"],"status":"open","forwarded_to":null,"analyst_notes":""}];

const state = {
  tickets: TICKETS.map(t => ({...t})),
  sevFilter: new Set(["critical","high","medium","low","info"]),
  statusFilter: new Set(["open","closed","forwarded"]),
  catFilter: null,
  search: "",
  expanded: new Set(),
  notesOpen: new Set(),
};

const SEV_ORDER = {critical:0, high:1, medium:2, low:3, info:4};
const TEAMS = ["Incident Response", "Network Team", "Endpoint / EDR Team", "Application Security", "Management / CISO"];

function render(){
  renderStats();
  renderSevFilters();
  renderStatusFilters();
  renderCatFilters();
  renderQueue();
}

function renderStats(){
  const c = state.tickets;
  const total = c.length;
  const open = c.filter(t=>t.status==="open").length;
  const crit = c.filter(t=>t.severity==="critical" && t.status==="open").length;
  const high = c.filter(t=>t.severity==="high" && t.status==="open").length;
  const closed = c.filter(t=>t.status==="closed").length;
  document.getElementById("stats").innerHTML = `
    <div class="stat open"><div class="n">${open}</div><div class="l">Open</div></div>
    <div class="stat crit"><div class="n">${crit}</div><div class="l">Critical</div></div>
    <div class="stat high"><div class="n">${high}</div><div class="l">High</div></div>
    <div class="stat"><div class="n" style="color:var(--text-mute)">${closed}</div><div class="l">Closed</div></div>
    <div class="stat"><div class="n" style="color:var(--text-mute)">${total}</div><div class="l">Total</div></div>
  `;
}

function renderSevFilters(){
  const sevs = ["critical","high","medium","low"];
  const el = document.getElementById("sevFilters");
  el.innerHTML = sevs.map(s => {
    const count = state.tickets.filter(t=>t.severity===s).length;
    const active = state.sevFilter.has(s) ? "active" : "";
    return `<div class="chip ${active}" onclick="toggleSev('${s}')">
      <span class="sw ${s}"></span><span style="flex:1">${s}</span><span class="ct">${count}</span>
    </div>`;
  }).join("");
}

function renderStatusFilters(){
  const statuses = ["open","closed","forwarded"];
  const el = document.getElementById("statusFilters");
  el.innerHTML = statuses.map(s => {
    const count = state.tickets.filter(t=>t.status===s).length;
    const active = state.statusFilter.has(s) ? "active" : "";
    return `<div class="chip ${active}" onclick="toggleStatus('${s}')">
      <span class="sw ${s}"></span><span style="flex:1">${s}</span><span class="ct">${count}</span>
    </div>`;
  }).join("");
}

function renderCatFilters(){
  const cats = [...new Set(state.tickets.map(t=>t.category))].sort();
  const el = document.getElementById("catFilters");
  const allActive = state.catFilter === null ? "active" : "";
  let html = `<div class="chip ${allActive}" onclick="setCat(null)"><span style="flex:1">All</span></div>`;
  html += cats.map(c => {
    const count = state.tickets.filter(t=>t.category===c).length;
    const active = state.catFilter === c ? "active" : "";
    return `<div class="chip ${active}" onclick="setCat('${c.replace(/'/g,"\\'")}')">
      <span style="flex:1">${c}</span><span class="ct">${count}</span>
    </div>`;
  }).join("");
  el.innerHTML = html;
}

function matchesFilters(t){
  if(!state.sevFilter.has(t.severity)) return false;
  if(!state.statusFilter.has(t.status)) return false;
  if(state.catFilter !== null && t.category !== state.catFilter) return false;
  if(state.search){
    const s = state.search.toLowerCase();
    const hay = `${t.title} ${t.description} ${t.src_ip||""} ${t.dst_ip||""} ${t.user||""} ${t.category}`.toLowerCase();
    if(!hay.includes(s)) return false;
  }
  return true;
}

function renderQueue(){
  const filtered = state.tickets
    .filter(matchesFilters)
    .sort((a,b) => (SEV_ORDER[a.severity]-SEV_ORDER[b.severity]) || (a.status==="open"?-1:1));

  document.getElementById("queueCount").textContent = `${filtered.length} shown / ${state.tickets.length} total`;

  const list = document.getElementById("ticketList");
  if(filtered.length === 0){
    list.innerHTML = `<div class="empty"><div class="big">—</div>No tickets match the current filters.</div>`;
    return;
  }

  list.innerHTML = filtered.map(t => {
    const isOpen = state.expanded.has(t.id);
    const notesShown = state.notesOpen.has(t.id);
    const evidenceHtml = t.evidence.map(l => `<div>${escapeHtml(l)}</div>`).join("");
    const teamOptions = TEAMS.map(team =>
      `<option value="${team}" ${t.forwarded_to===team?"selected":""}>${team}</option>`
    ).join("");

    let resolvedTag = "";
    if(t.status === "closed"){
      resolvedTag = `<div class="resolved-tag">Closed${t.analyst_notes ? " — " + escapeHtml(t.analyst_notes) : ""}</div>`;
    } else if(t.status === "forwarded"){
      resolvedTag = `<div class="resolved-tag">Forwarded to ${escapeHtml(t.forwarded_to||"")}${t.analyst_notes ? " — " + escapeHtml(t.analyst_notes) : ""}</div>`;
    }

    return `
    <div class="ticket sev-${t.severity} status-${t.status} ${isOpen?'expanded':''}" data-id="${t.id}">
      <div class="ticket-row" onclick="toggleExpand('${t.id}')">
        <div class="sev-badge ${t.severity}">${t.severity}</div>
        <div class="ticket-title">
          <div class="t">${escapeHtml(t.title)}</div>
          <div class="m">${t.id} · ${escapeHtml(t.timestamp)}</div>
        </div>
        <div class="ticket-cat">${escapeHtml(t.category)}</div>
        <div class="ticket-status ${t.status}">${t.status}</div>
        <div class="chevron">&#9656;</div>
      </div>
      <div class="ticket-body">
        <div class="tb-section">
          <div class="tb-label">Description</div>
          <div class="tb-desc">${escapeHtml(t.description)}</div>
        </div>
        <div class="tb-section">
          <div class="tb-label">Recommended action</div>
          <div class="tb-action">${escapeHtml(t.recommended_action)}</div>
        </div>
        <div class="tb-meta">
          ${t.src_ip ? `<span><b>src</b>${t.src_ip}</span>` : ""}
          ${t.dst_ip ? `<span><b>dst</b>${t.dst_ip}</span>` : ""}
          ${t.user ? `<span><b>user</b>${escapeHtml(t.user)}</span>` : ""}
          <span><b>events</b>${t.event_count}</span>
        </div>
        <div class="tb-section">
          <div class="tb-label">Raw evidence (${t.evidence.length} of ${t.event_count} logged)</div>
          <div class="evidence">${evidenceHtml}</div>
        </div>

        ${t.status === "open" ? `
        <div class="tb-actions">
          <button class="act close-btn" onclick="event.stopPropagation(); closeTicket('${t.id}')">Close ticket</button>
          <button class="act forward-btn" onclick="event.stopPropagation(); toggleForwardUI('${t.id}')">Forward</button>
          <select class="fwd-select" id="team-${t.id}" onclick="event.stopPropagation()">${teamOptions}</select>
          <button class="act" onclick="event.stopPropagation(); confirmForward('${t.id}')" style="display:none" id="fwd-confirm-${t.id}">Confirm forward</button>
        </div>
        <div class="notes-row ${notesShown?'show':''}" id="notes-row-${t.id}">
          <textarea class="notes" id="notes-${t.id}" placeholder="Analyst notes (optional)...">${escapeHtml(t.analyst_notes||"")}</textarea>
        </div>
        ` : `
        <div class="tb-actions">
          <button class="act reopen-btn" onclick="event.stopPropagation(); reopenTicket('${t.id}')">Reopen</button>
        </div>
        ${resolvedTag}
        `}
      </div>
    </div>`;
  }).join("");
}

function escapeHtml(s){
  if(s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function toggleSev(s){
  if(state.sevFilter.has(s)) state.sevFilter.delete(s); else state.sevFilter.add(s);
  render();
}
function toggleStatus(s){
  if(state.statusFilter.has(s)) state.statusFilter.delete(s); else state.statusFilter.add(s);
  render();
}
function setCat(c){ state.catFilter = c; render(); }

function toggleExpand(id){
  if(state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
  render();
}

function findTicket(id){ return state.tickets.find(t=>t.id===id); }

function closeTicket(id){
  const t = findTicket(id);
  const notesEl = document.getElementById(`notes-${id}`);
  t.analyst_notes = notesEl ? notesEl.value : t.analyst_notes;
  t.status = "closed";
  render();
}

function reopenTicket(id){
  const t = findTicket(id);
  t.status = "open";
  t.forwarded_to = null;
  state.expanded.add(id);
  render();
}

function toggleForwardUI(id){
  if(state.notesOpen.has(id)) state.notesOpen.delete(id); else state.notesOpen.add(id);
  const el = document.getElementById(`fwd-confirm-${id}`);
  if(el) el.style.display = el.style.display === "none" ? "inline-block" : "none";
  render();
  state.expanded.add(id);
}

function confirmForward(id){
  const t = findTicket(id);
  const teamSel = document.getElementById(`team-${id}`);
  const notesEl = document.getElementById(`notes-${id}`);
  t.forwarded_to = teamSel ? teamSel.value : TEAMS[0];
  t.analyst_notes = notesEl ? notesEl.value : t.analyst_notes;
  t.status = "forwarded";
  render();
}

render();
</script>
</body>
</html>
